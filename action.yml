name: EndNext baseline comparison
description: Compare saved EndNext reports and publish a summary and comparison artifact.
inputs:
  baseline:
    description: Path to the saved baseline JSON report.
    required: true
  current:
    description: Path to the saved current JSON report.
    required: true
  exceptions:
    description: Path to an optional TOML finding exceptions policy.
    required: false
    default: ''
  artifact-name:
    description: Name of the output artifact. Use a distinct name for each comparison in a run.
    required: false
    default: endnext-diff
outputs:
  exit-code:
    description: 'EndNext result code: 0 for a pass, 1 for a blocking finding, 2 for incomplete verification or invalid input.'
    value: ${{ steps.compare.outputs.exit-code }}
  artifact-id:
    description: ID of the uploaded comparison artifact.
    value: ${{ steps.artifact.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    - name: Install EndNext from the Action revision
      id: install
      shell: bash
      env:
        ENDNEXT_SOURCE: ${{ github.action_path }}
      run: |
        work_dir=$(mktemp -d "$RUNNER_TEMP/endnext.XXXXXX")
        mkdir "$work_dir/evidence"
        cd "$work_dir"
        python -I -m venv "$work_dir/venv"
        py="$work_dir/venv/bin/python"
        "$py" -I -m pip install --only-binary=:all: --require-hashes -r "$ENDNEXT_SOURCE/.github/requirements/action.txt"
        "$py" -I -m pip install --no-index --no-deps --no-build-isolation "$ENDNEXT_SOURCE"
        "$py" -I -m pip check
        printf 'work-dir=%s\n' "$work_dir" >> "$GITHUB_OUTPUT"
    - name: Compare reports
      id: compare
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ENDNEXT_WORK_DIR: ${{ steps.install.outputs.work-dir }}
        ENDNEXT_BASELINE: ${{ inputs.baseline }}
        ENDNEXT_CURRENT: ${{ inputs.current }}
        ENDNEXT_EXCEPTIONS: ${{ inputs.exceptions }}
      run: |
        args=(diff --format json)
        if [[ -n "$ENDNEXT_EXCEPTIONS" ]]; then
          args+=(--exceptions "$ENDNEXT_EXCEPTIONS")
        fi
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          args+=(--summary-file "$GITHUB_STEP_SUMMARY")
        fi
        evidence="$ENDNEXT_WORK_DIR/evidence"
        status=0
        "$ENDNEXT_WORK_DIR/venv/bin/endnext" "${args[@]}" -- "$ENDNEXT_BASELINE" "$ENDNEXT_CURRENT" \
          > "$evidence/diff.json" 2> "$evidence/diagnostics.txt" || status=$?
        if [[ "$status" != 0 && "$status" != 1 && "$status" != 2 ]]; then
          status=2
        fi
        if [[ ! -s "$evidence/diff.json" ]]; then
          rm -- "$evidence/diff.json"
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            printf '### EndNext comparison\n\nEndNext could not compare the reports. See the diagnostics artifact.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          status=2
          if [[ ! -s "$evidence/diagnostics.txt" ]]; then
            printf 'EndNext did not produce comparison evidence.\n' > "$evidence/diagnostics.txt"
          fi
        fi
        if [[ ! -s "$evidence/diagnostics.txt" ]]; then
          rm -- "$evidence/diagnostics.txt"
        fi
        printf 'exit-code=%s\n' "$status" >> "$GITHUB_OUTPUT"
    - name: Upload comparison evidence
      id: artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.install.outputs.work-dir }}/evidence
        if-no-files-found: error
    - name: Apply comparison result
      shell: bash
      env:
        ENDNEXT_EXIT_CODE: ${{ steps.compare.outputs.exit-code }}
      run: |
        case "$ENDNEXT_EXIT_CODE" in
          0) exit 0 ;;
          1) echo '::error::EndNext found a blocking failure. See the comparison artifact.'; exit 1 ;;
          *) echo '::error::EndNext could not verify the comparison completely. See the comparison artifact.'; exit 2 ;;
        esac
