[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "endnext"
version = "0.1.0.dev0"
description = "Offline verification of observed API responses against OpenAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "httpx>=0.28.1,<0.29",
    "openapi-core==0.23.1",
    "jsonschema>=4.24,<5",
    "jsonschema-path>=0.4.6,<0.6",
    "PyYAML>=6.0.2,<7",
    "referencing>=0.37,<0.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<3",
    "types-jsonschema>=4.24,<5",
    "types-PyYAML>=6,<7",
]

[project.scripts]
endnext = "endnext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["endnext"]
patch = ["subprocess"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 96

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
strict = true
enable_error_code = ["ignore-without-code"]
