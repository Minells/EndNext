name: Main CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' build
      - name: Lint and type-check
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m mypy
      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Publish coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Verify the wheel and source distribution
        shell: bash
        run: |
          distribution_dir="$(mktemp -d)"
          python -m build --outdir "$distribution_dir"

          for artifact in "$distribution_dir"/*.whl "$distribution_dir"/*.tar.gz; do
            artifact_env="$(mktemp -d)"
            python -m venv "$artifact_env"
            "$artifact_env/bin/python" -m pip install "$artifact"
            endnext="$artifact_env/bin/endnext"
            "$endnext" inspect examples/items.openapi.json
            "$endnext" check examples/items.openapi.json examples/item-pass.json --format json > "$artifact_env/baseline.json"

            status=0
            "$endnext" check examples/items.openapi.json examples/item-fail.json --format json > "$artifact_env/current.json" || status=$?
            test "$status" -eq 1
            "$endnext" report "$artifact_env/current.json"

            status=0
            "$endnext" diff "$artifact_env/baseline.json" "$artifact_env/current.json" || status=$?
            test "$status" -eq 1
          done
      - name: Verify minimum supported build and test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          work_dir=$(mktemp -d)
          python -m venv "$work_dir/venv"
          py="$work_dir/venv/bin/python"
          "$py" -m pip install setuptools==84.1.0 pytest==9.0.3 build wheel
          "$py" -m build --no-isolation --outdir "$work_dir/dist"
          for artifact in "$work_dir/dist/"*; do
            "$py" -m pip install --no-build-isolation --force-reinstall "$artifact"
            "$py" -m pytest -q tests/test_api_v1.py -k isolated_checker
          done
      - name: Prepare saved reports for the EndNext Action
        if: runner.os == 'Linux'
        id: comparison-reports
        shell: bash
        run: |
          input_dir=$(mktemp -d "$RUNNER_TEMP/endnext-action-inputs.XXXXXX")
          printf 'dir=%s\n' "$input_dir" >> "$GITHUB_OUTPUT"
          endnext check examples/items.openapi.json examples/item-pass.json --format json > "$input_dir/pass.json"
          status=0
          endnext check examples/items.openapi.json examples/item-fail.json --format json > "$input_dir/fail.json" || status=$?
          test "$status" -eq 1
          python - "$input_dir/partial-fixture.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          fixture = json.loads(Path('examples/item-pass.json').read_text())
          del fixture['body']
          fixture['body_state'] = 'truncated'
          Path(sys.argv[1]).write_text(json.dumps(fixture))
          PY
          status=0
          endnext check examples/items.openapi.json "$input_dir/partial-fixture.json" --format json > "$input_dir/partial.json" || status=$?
          test "$status" -eq 2
      - name: EndNext Action blocks a new failure
        if: runner.os == 'Linux'
        id: regression
        continue-on-error: true
        uses: ./
        with:
          baseline: ${{ steps.comparison-reports.outputs.dir }}/pass.json
          current: ${{ steps.comparison-reports.outputs.dir }}/fail.json
          artifact-name: endnext-regression
      - name: EndNext Action reports an existing failure
        if: runner.os == 'Linux'
        id: existing
        uses: ./
        with:
          baseline: ${{ steps.comparison-reports.outputs.dir }}/fail.json
          current: ${{ steps.comparison-reports.outputs.dir }}/fail.json
          artifact-name: endnext-existing
      - name: EndNext Action flags incomplete verification
        if: runner.os == 'Linux'
        id: incomplete
        continue-on-error: true
        uses: ./
        with:
          baseline: ${{ steps.comparison-reports.outputs.dir }}/pass.json
          current: ${{ steps.comparison-reports.outputs.dir }}/partial.json
          artifact-name: endnext-incomplete
      - name: Verify Action results and artifact uploads
        if: runner.os == 'Linux'
        shell: bash
        env:
          REGRESSION: ${{ steps.regression.outcome }}:${{ steps.regression.outputs.exit-code }}
          EXISTING: ${{ steps.existing.outcome }}:${{ steps.existing.outputs.exit-code }}
          INCOMPLETE: ${{ steps.incomplete.outcome }}:${{ steps.incomplete.outputs.exit-code }}
          REGRESSION_ARTIFACT: ${{ steps.regression.outputs.artifact-id }}
          EXISTING_ARTIFACT: ${{ steps.existing.outputs.artifact-id }}
          INCOMPLETE_ARTIFACT: ${{ steps.incomplete.outputs.artifact-id }}
        run: |
          test "$REGRESSION" = failure:1
          test "$EXISTING" = success:0
          test "$INCOMPLETE" = failure:2
          test -n "$REGRESSION_ARTIFACT"
          test -n "$EXISTING_ARTIFACT"
          test -n "$INCOMPLETE_ARTIFACT"

  verify_windows_offline:
    name: Verify offline on Windows
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build
      - name: Build the wheel
        run: python -m build --wheel --outdir "$env:RUNNER_TEMP\endnext-wheel"
      - name: Install the wheel and test dependencies
        run: |
          $wheel = Get-ChildItem -Path "$env:RUNNER_TEMP\endnext-wheel" -Filter '*.whl'
          python -m pip install "$($wheel.FullName)[dev]"
      - name: Verify offline commands and the Python API
        run: >-
          python -m pytest
          tests/test_api_v1.py
          tests/test_benchmark.py
          tests/test_check.py
          tests/test_cli_views.py
          tests/test_diff.py
          tests/test_planner_validation.py
          tests/test_reports.py
          tests/test_resilience.py
          tests/test_resilience_generation.py::test_seeded_cli_replays_byte_identical_scenarios_offline

  dependency-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check resolved packages for known vulnerabilities
        run: |
          project_env="$RUNNER_TEMP/endnext-dependencies"
          python -m venv "$project_env"
          project_python="$project_env/bin/python"
          "$project_python" -m pip install --only-binary=:all: --require-hashes -r .github/requirements/action.txt
          "$project_python" -m pip install --no-build-isolation -e '.[dev]' build
          "$project_python" -m pip check
          "$project_python" -VV > "$RUNNER_TEMP/python-version.txt"
          "$project_python" -m pip list --format=json > "$RUNNER_TEMP/packages.json"

          # EndNext is the source under review. Audit every third-party distribution strictly.
          "$project_python" -m pip uninstall -y endnext
          python -m pip install 'pip-audit==2.10.1'
          site_packages=$("$project_python" -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          python -m pip_audit --path "$site_packages" --strict --progress-spinner off --format json --output "$RUNNER_TEMP/audit.json"
      - name: Save dependency audit evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/python-version.txt
            ${{ runner.temp }}/packages.json
            ${{ runner.temp }}/audit.json

  merge-gate:
    name: EndNext merge gate
    if: ${{ always() }}
    needs: [verify, verify_windows_offline, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful verification on every platform
        env:
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          WINDOWS_RESULT: ${{ needs.verify_windows_offline.result }}
        run: test "$AUDIT_RESULT" = success && test "$VERIFY_RESULT" = success && test "$WINDOWS_RESULT" = success
